server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 20m;

    # Docker's embedded DNS (127.0.0.11) + a variable in fastcgi_pass forces
    # nginx to re-resolve "backend" on every request instead of caching the
    # IP once at startup. Without this, restarting the backend container
    # alone (a new container = a new IP) leaves nginx stuck pointing at the
    # old, now-dead address until nginx itself is restarted too.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_backend backend:9000;
        fastcgi_pass $upstream_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
