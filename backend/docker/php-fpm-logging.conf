; Without this, PHP-FPM silently discards worker stdout/stderr and fatal
; errors never reach `docker compose logs` — they just show up as an opaque
; 500 with no clue why. Costs nothing in a dev/demo image.
[www]
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
